# search.peptides on dev2: the Moshpit origin vhost. Installed as
# /etc/moshpit/templates/search.peptides.conf so moshpit-renew keeps it on renewal.
#
# Port 80 serves the site too (no redirect): a stock browser cannot check a
# Moshpit certificate, and the pit.world relay connects over TLS anyway.

server {
    listen 80;
    listen [::]:80;
    server_name search.peptides;
    access_log off;
    error_log  /var/log/nginx/search.peptides.error.log crit;
    client_max_body_size 1m;

    # The app: github.com/moshcoder/search.peptides, systemd unit search-peptides, /opt/search.peptides.
    location / {
        proxy_pass http://127.0.0.1:8802;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.peptides;

    ssl_certificate     /etc/ssl/moshpit/search.peptides.crt;
    ssl_certificate_key /etc/ssl/moshpit/search.peptides.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Groups X25519MLKEM768:X25519:P-256;
    ssl_session_tickets off;
    ssl_session_cache shared:MoshpitSSL:10m;
    # No HSTS: a promise about a name the public DNS does not own.

    access_log off;
    error_log  /var/log/nginx/search.peptides.error.log crit;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8802;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
