# bin/install.sh settings for search.peptides (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: they go in $STATE_DIR/app.env, written from the logicsrc vault
# profullstack/search-peptides--prod (SITE_URL, DB_PATH, COINPAY_*, PIT_VERIFY, CRAWLPROOF_*).
#
# DOMAINS is empty on purpose: search.peptides is a Moshpit name, so there is no Let's
# Encrypt certificate to get. Its nginx vhost (deploy/nginx-search.peptides.conf) proxies
# to PORT with the Moshpit-issued certificate that moshpit-renew.timer keeps fresh.
APP=search-peptides
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/main.js
PORT=8802
HEALTH_PATH=/health
DOMAINS=
ACCESS_LOG=off
